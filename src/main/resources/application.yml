spring:
  application:
    name: floww-exchange

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/floww}
    username: ${SPRING_DATASOURCE_USERNAME:floww}
    password: ${SPRING_DATASOURCE_PASSWORD:floww_secret}
    hikari:
      maximum-pool-size: 40
      minimum-idle: 10
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# ─── Exchange-specific config ─────────────────────────────────────
floww:
  exchange:
    type: SIMULATED
    admin-token: ${ADMIN_TOKEN}
    api-key-prefix: "flw_"
    api-key-length: 48
    rate-limit:
      orders-per-second: 20
      order-burst-capacity: 50
      order-burst-window-seconds: 10
      global-requests-per-second: 100
      registrations-per-ip-per-day: 1
      max-open-orders: 100000
      cancellations-per-minute: 1000
    circuit-breaker:
      threshold-percent: 20
      halt-duration-minutes: 15
    order-validation:
      max-price-deviation-percent: 80
    webhook:
      max-retries: 5
      initial-backoff-ms: 1000
      simulator-key-hashes:
        # Add SHA-256 hashes of your simulator API keys here.
        # Example: - "<sha256-hash-of-your-simulator-api-key>"
    snapshot:
      interval-seconds: 5
    market-hours:
      open-time: "09:15"
      close-time: "15:30"
      timezone: "Asia/Kolkata"

server:
  port: 8081
  tomcat.threads.max: 500

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.floww.exchange: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: DEBUG
